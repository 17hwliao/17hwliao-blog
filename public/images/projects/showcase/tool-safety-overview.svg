<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">工具执行前的安全扫描</title><desc id="desc">PR 2091 的流程讲解预览：请求经过扫描与策略匹配后，允许、阻断或等待审阅。</desc><rect width="960" height="600" fill="#f2f4f0"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="70" y="84" font-size="16" letter-spacing="3" fill="#66756a">PULL REQUEST / 2091</text><text x="70" y="146" font-size="36" font-weight="600" fill="#242c27">执行之前，先看清边界。</text><rect x="70" y="197" width="820" height="72" rx="10" fill="#fff" stroke="#d4ddd5"/><text x="98" y="241" font-family="Consolas,monospace" font-size="24" fill="#34493d">workspace_exec → safety.PermissionPolicy</text><path d="M255 269v48m450-48v48m-450 0h450" fill="none" stroke="#a4b6a8" stroke-width="2"/><g fill="#fff" stroke="#c5d3c8"><rect x="70" y="338" width="254" height="144" rx="12"/><rect x="353" y="338" width="254" height="144" rx="12"/><rect x="636" y="338" width="254" height="144" rx="12"/></g><g font-size="15" letter-spacing="2" fill="#718076"><text x="96" y="375">ALLOW</text><text x="379" y="375">DENY</text><text x="662" y="375">REVIEW</text></g><g font-size="27" fill="#2c4233"><text x="96" y="432">允许继续</text><text x="379" y="432">执行前阻断</text><text x="662" y="432">等待人工审阅</text></g><text x="70" y="544" font-size="16" fill="#6a776d">REQUEST → SCAN → POLICY → DECISION → AUDIT</text></g></svg>
